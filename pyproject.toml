[project]
name = "basivo-pii"
version = "0.1.0"
description = "Find and mask PII in text with our fine-tuned model. Our own code, no Presidio or spaCy."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",   # 4.48: first version with ModernBERT (mmBERT)
    "cryptography>=42",     # encrypt operator (AES-GCM)
    "pyyaml>=6",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
